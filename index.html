<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PilotApp v4</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- iOS / iPad Optimierungen -->
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

<!-- ========================================================= -->
<!-- TOPBAR -->
<!-- ========================================================= -->

<div class="topbar">

  <div class="brand">
    <div class="dot"></div>
    <div>
      <div class="title">PilotApp</div>
      <div class="sub" id="subline">lade…</div>
    </div>
  </div>

  <div class="controls">

    <!-- Ziellotse -->
    <div class="ctrl">
      <div>Ziellotse</div>
      <select id="lotseSelect"></select>
    </div>

    <!-- Ansicht -->
    <div class="ctrl">
      <div>Ansicht</div>
      <select id="viewSelect">
        <option value="kanal">Kanal</option>
        <option value="gesamtboert">Gesamtbört</option>
        <option value="seelotsen">Abgeteilte Seelotsen</option>
        <option value="meldungen">Meldungen</option>
        <option value="graph">Work Start Graph</option>
      </select>
    </div>

    <!-- Refresh -->
    <button class="btn" id="refreshBtn">Refresh</button>

  </div>
</div>

<!-- ========================================================= -->
<!-- CONTENT -->
<!-- ========================================================= -->

<div class="container">
  <div id="content"></div>
</div>

<!-- ========================================================= -->
<!-- MODAL (für Schiff-Details etc.) -->
<!-- ========================================================= -->

<div id="modalBackdrop" class="modalBackdrop" style="display:none;">
  <div class="modal">

    <div class="modalHeader">
      <div class="modalTitle" id="modalTitle">Details</div>
      <button class="btn" id="modalClose">Schließen</button>
    </div>

    <div class="modalBody">
      <pre class="mono" id="modalPre"></pre>
    </div>

  </div>
</div>

<!-- ========================================================= -->
<!-- JS -->
<!-- ========================================================= -->

<script src="js/app.js"></script>

</body>
</html>
