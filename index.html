<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PilotApp v4</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <div class="title">PilotApp v4</div>
        <div class="sub" id="statusLine">lädt…</div>
      </div>
    </div>

    <div class="controls">
      <label class="ctrl">
        <span>Ziellotse</span>
        <select id="lotseSelect"></select>
      </label>

      <label class="ctrl">
        <span>Ansicht</span>
        <select id="viewSelect">
          <option value="gesamtboert">Gesamtbört</option>
          <option value="seelotsen">Abgeteilte Seelotsen</option>
          <option value="kanal">Kanal</option>
          <option value="graph">Work Start Graph</option>
          <option value="meldungen_kiel">Meldungen Kiel</option>
        </select>
      </label>

      <button id="refreshBtn" class="btn">↻</button>
    </div>
  </header>

  <main class="container">
    <div id="content" class="content"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
