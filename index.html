<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PilotApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">PilotApp</div>
      <div class="meta">
        <span id="updateLabel">Update: –</span>
      </div>
    </div>

    <div class="controls">
      <label class="control">
        <span>Lotse</span>
        <select id="pilotSelect"></select>
      </label>

      <button id="reloadBtn" class="btn">Reload</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="aktuell">Aktuell</button>
    <button class="tab" data-tab="gesamtboert">Gesamtbört</button>
    <button class="tab" data-tab="graph">Graph</button>
    <button class="tab" data-tab="meld_kiel">Meldungen Kiel</button>
    <button class="tab" data-tab="meld_rueb">Meldungen Rüsterbergen</button>
    <button class="tab" data-tab="seelotsen">Abgeteilte Seelotsen</button>
  </nav>

  <main class="main">
    <section class="panel active" id="panel-aktuell">
      <div class="card" id="aktuellCard"></div>
      <div class="hint" id="aktuellHint"></div>
    </section>

    <section class="panel" id="panel-gesamtboert">
      <div class="hint" id="gbHint"></div>
      <div class="tableWrap">
        <table class="table" id="gbTable">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Takt</th>
              <th>Name</th>
              <th>Pfeil</th>
              <th>Zeit</th>
              <th>Bem.</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-graph">
      <div class="hint" id="graphHint"></div>
      <canvas id="graphCanvas" width="1200" height="420"></canvas>
    </section>

    <section class="panel" id="panel-meld_kiel">
      <div class="hint" id="mkHint"></div>
      <pre class="mono" id="mkRaw"></pre>
    </section>

    <section class="panel" id="panel-meld_rueb">
      <div class="hint" id="mrHint"></div>
      <pre class="mono" id="mrRaw"></pre>
    </section>

    <section class="panel" id="panel-seelotsen">
      <div class="hint" id="slHint"></div>
      <div class="tableWrap">
        <table class="table" id="slTable">
          <thead>
            <tr>
              <th>Zeit</th>
              <th>Name</th>
              <th>Aufgabe</th>
              <th>Fzg</th>
              <th>Ort</th>
              <th>+8h</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
