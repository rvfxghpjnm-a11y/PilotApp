<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PilotApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <div class="title">PilotApp</div>
      <div class="sub" id="generated"></div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label>Lotse</label>
      <select id="lotseSelect"></select>
    </div>

    <button class="btn" id="reloadBtn">Reload</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="aktuell">Aktuell</button>
  <button class="tab" data-tab="boert">Gesamtbört</button>
  <button class="tab" data-tab="graph">Graph</button>
  <button class="tab" data-tab="kiel">Meldungen Kiel</button>
  <button class="tab" data-tab="rueb">Meldungen Rüsterbergen</button>
  <button class="tab" data-tab="seelotsen">Seelotsen</button>
</div>

<main class="container">

  <div id="aktuell" class="view active"></div>
  <div id="boert" class="view"></div>
  <div id="graph" class="view"></div>
  <div id="kiel" class="view"></div>
  <div id="rueb" class="view"></div>
  <div id="seelotsen" class="view"></div>

</main>

<script src="js/app.js"></script>
</body>
</html>
